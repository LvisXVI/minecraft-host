<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23157a74'/%3E%3Cstop offset='1' stop-color='%2305201f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='url(%23t)'/%3E%3Cpath d='M16 19 L26 24 L16 29 L6 24 Z' fill='%233a4a58'/%3E%3Cpath d='M6 24 L16 29 L16 31 L6 26 Z' fill='%23202b36'/%3E%3Cpath d='M26 24 L16 29 L16 31 L26 26 Z' fill='%2317202a'/%3E%3Cpath d='M16 11.5 L24 15.5 L16 19.5 L8 15.5 Z' fill='%2374e06c'/%3E%3Cpath d='M8 15.5 L16 19.5 L16 25 L8 21 Z' fill='%238d5b2c'/%3E%3Cpath d='M24 15.5 L16 19.5 L16 25 L24 21 Z' fill='%236c4321'/%3E%3Cpath d='M10 7 a8 8 0 0 1 12 0' fill='none' stroke='%23bffcf0' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='1.6' fill='%23fff'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='7.5' fill='none' stroke='%23fff' stroke-opacity='.3'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111c">
  <title>Minecraft Host</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="launch" class="launch" role="status" aria-live="polite"><div class="launch-core"><span class="launch-block" aria-hidden="true"></span><div class="launch-title">MINECRAFT HOST</div><div class="launch-sub">Server werden geladen …</div><div class="launch-bar" aria-hidden="true"></div></div></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>MINECRAFT HOST</strong><span class="brand-sub">Lokaler Servermanager</span></div>
    <div class="topright"><button class="update-pill" id="update-pill" type="button" hidden></button><button class="phone-toggle" id="phone-toggle" type="button" title="Mit der Android-App von unterwegs steuern"><span aria-hidden="true">📱</span> Handy</button><button class="version-tag" id="version-tag" type="button" title="Nach Updates suchen">v–</button><span id="clock"></span><div class="design-picker"><button class="design-toggle" id="design-toggle" type="button" aria-haspopup="true" aria-expanded="false"><span class="design-swatch" aria-hidden="true"></span><span>Design</span></button><div class="design-menu" id="design-menu" role="menu" hidden></div></div><span class="local-tag">LÄUFT AUF DIESEM PC</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-heading">DEINE SERVER <span id="server-count">00</span></div>
      <div id="server-list" class="server-list"></div>
      <button class="side-new" id="new-server-button"><span class="plus">+</span> Server erstellen</button>
      <button class="side-new" id="link-import-button">Modrinth-Link importieren</button>
      <button class="side-new" id="join-share-button">Freundes-Server verbinden</button>
      <div class="side-bottom">
        <div class="side-rule"></div>
        <div class="side-label">DATEIEN AUF DEINEM PC</div>
        <p>Welten, Mods und Einstellungen bleiben lokal gespeichert.</p>
        <p>Beim Schließen des letzten Host-Tabs beendet sich die App und stoppt laufende Server.</p>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <input id="import-input" type="file" accept=".mrpack,.zip" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
