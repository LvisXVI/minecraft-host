name: Android app

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Version from tag
        run: |
          name="${GITHUB_REF_NAME#android-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || name="0.0.${GITHUB_RUN_NUMBER}"
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      # OpenJDK 25 for Android (GPL-2.0 with Classpath Exception), built by AngelAuraMC.
      # Pinned by checksum; trimmed to what a headless Minecraft server needs.
      - name: Java runtime for phone hosting
        env:
          JRE_URL: https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/download_jre25/jre25-android-arm64.tar.xz
          JRE_SHA256: d3eb7afe2240c26728a1bb440502c5f18ac3883e932d202dd7f0c9bcbbce4c37
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jre.tar.xz" "$JRE_URL"
          echo "$JRE_SHA256  $RUNNER_TEMP/jre.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/jre"
          tar -xJf "$RUNNER_TEMP/jre.tar.xz" -C "$RUNNER_TEMP/jre"
          cd "$RUNNER_TEMP/jre"
          find bin -type f ! -name java -delete
          rm -rf lib/ct.sym lib/src.zip lib/fonts include jmods man demo
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets/runtime"
          zip -qr -9 "$GITHUB_WORKSPACE/android/app/src/main/assets/runtime/jre.zip" .
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/assets/runtime"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MCHost-Remote-${ANDROID_VERSION_NAME}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      # Not "latest": the desktop self-updater reads the latest release and must keep finding the Windows build.
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MC Host for Android ${{ env.ANDROID_VERSION_NAME }}
          make_latest: "false"
          files: out/*
          body: |
            **MC Host for Android** – two modes in one app:

            - **Control your PC:** start and stop servers on Minecraft Host, live console, commands, settings, new servers, Modrinth imports and the tunnel. Needs Minecraft Host 1.2.0+: click **📱 Handy**, turn on remote control and pair with the shown address and code. Away from home, install Tailscale on PC and phone and use the 100.x address.
            - **Host on this phone:** create a Vanilla or Fabric server (Minecraft 1.18+), start it with the built-in Java 25 and play with friends on the same Wi-Fi, via Tailscale or a playit address. A notification keeps the server running with the screen off – best on the charger. ARM64 phones, 2 GB server RAM recommended.

            Install the APK (allow installs from your browser once). Android may note that the app was built for an older Android version: phone hosting needs that to start the bundled Java runtime.

            Java runtime: OpenJDK 25 (GPL-2.0 with Classpath Exception) built for Android by [AngelAuraMC](https://github.com/AngelAuraMC/angelauramc-openjdk-build); source at [openjdk.org](https://openjdk.org/).
